name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The default pytest run is `-m 'not llm'`, so no API key is needed and nothing is spent.
      # The pinned semgrep is installed because both matrix interpreters have a wheel for it; a
      # leg whose interpreter it has not caught up with would drop the extra and still run the
      # full unit suite, since every semgrep path there is stubbed against a fake subprocess.
      - run: uv sync --frozen --extra dev --extra semgrep --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov

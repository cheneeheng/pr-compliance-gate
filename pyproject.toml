[project]
name = "pr-compliance-gate"
version = "0.1.0"
description = "A LangGraph + Claude Agent SDK pipeline that reviews pull requests against security, licensing, and data-handling policy before merge — cost-gated, human-in-the-loop."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "langgraph",
    "claude-agent-sdk",
    "anthropic",
    "agent-orchestration",
    "human-in-the-loop",
    "code-review-automation",
    "policy-compliance",
    "rag",
    "fastapi",
]
dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # Linear intake leg
    "langchain>=0.3",
    # Direct import in intake/ingest.py — langchain no longer pulls it in transitively.
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-chroma>=0.2",
    "chromadb>=1.0",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    # Investigator harness (SDK is young; pin the minor at install time if its surface moves)
    "claude-agent-sdk>=0.1,<0.2",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Config + logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without shipped type stubs.
module = [
    "langchain_chroma.*",
    "langchain_huggingface.*",
    "chromadb.*",
    "claude_agent_sdk.*",
    "langgraph.*",
    "langchain_anthropic.*",
    "langchain_text_splitters.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "llm: tests that make real Anthropic API calls (excluded from the default run)",
]
addopts = "-m 'not llm'"

[tool.coverage.run]
source = ["gate"]
branch = true

[tool.coverage.report]
# The default suite must cover every line and branch; the `llm` evals add nothing here.
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
